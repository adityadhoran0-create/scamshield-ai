services:
  - type: web
    name: scamshield-ai-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
